spring.datasource.url=jdbc:mysql://localhost:3306/intellidesk?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.timeout=30m
# Expose message in error responses (safe — only explicit ResponseStatusException messages are included)
server.error.include-message=always
intellidesk.two-factor=true
# Screenshot attachments: JPEG/PNG up to 10 MB, stored outside the database
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
intellidesk.upload-dir=${UPLOAD_DIR:uploads}
